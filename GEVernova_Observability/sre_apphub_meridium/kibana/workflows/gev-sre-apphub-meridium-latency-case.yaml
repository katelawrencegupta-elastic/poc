version: "1"
name: SRE AppHub → Meridium latency — case, RCA, HITL
enabled: true
description: >
  Alert or manual path for AppHub client latency / errors / timeouts to APM
  Classic and Meridium ingress. Creates or updates an Observability case,
  gathers destination and trace evidence, classifies RCA, and waits for HITL.
  Never changes routing or service config.
triggers:
  - type: alert
  - type: manual
    inputs:
      - name: service
        type: string
        required: false
        description: Caller service.name (e.g. predix-apphub-stage-active)
      - name: dest
        type: string
        required: false
        description: Destination resource (e.g. apm-classic-stage.apm.stage.usw02.15.energy:443)
      - name: lookback
        type: string
        required: false
        description: ES|QL duration for evidence (default "6 hours"). Use "3 days" for historical replay.
settings:
  timeout: 26h
  concurrency:
    key: "{{ event.alerts[0].kibana.alert.grouping.resource.attributes.service.name | default: inputs.service }}|{{ event.alerts[0].kibana.alert.grouping.attributes.span.destination.service.resource | default: inputs.dest }}|{{ event.alerts[0].kibana.alert.status | default: 'manual' }}"
    max: 1
    strategy: queue
steps:
  - name: extract
    type: data.set
    with:
      service: "{%- assign g = event.alerts[0].kibana.alert.grouping -%}{%- assign v = g.resource.attributes.service.name -%}{%- if v == nil or v == '' -%}{%- assign v = g['resource.attributes.service.name'] -%}{%- endif -%}{%- if v == nil or v == '' -%}{%- for item in event.alerts[0].kibana.alert.group -%}{%- if item.field == 'resource.attributes.service.name' -%}{%- assign v = item.value -%}{%- endif -%}{%- endfor -%}{%- endif -%}{%- if v == nil or v == '' -%}{%- assign v = inputs.service -%}{%- endif -%}{%- if v == nil or v == '' -%}predix-apphub-stage-active{%- else -%}{{ v | strip }}{%- endif -%}"
      dest: "{%- assign g = event.alerts[0].kibana.alert.grouping -%}{%- assign v = g.attributes.span.destination.service.resource -%}{%- if v == nil or v == '' -%}{%- assign v = g['attributes.span.destination.service.resource'] -%}{%- endif -%}{%- if v == nil or v == '' -%}{%- for item in event.alerts[0].kibana.alert.group -%}{%- if item.field == 'attributes.span.destination.service.resource' -%}{%- assign v = item.value -%}{%- endif -%}{%- endfor -%}{%- endif -%}{%- if v == nil or v == '' -%}{%- assign v = inputs.dest -%}{%- endif -%}{%- if v == nil or v == '' -%}apm-classic-stage.apm.stage.usw02.15.energy:443{%- else -%}{{ v | strip }}{%- endif -%}"
      alert_status: "{%- assign s = event.alerts[0].kibana.alert.status -%}{%- if s == nil or s == '' -%}active{%- else -%}{{ s | strip }}{%- endif -%}"
      rule_name: "{%- assign n = event.rule.name -%}{%- if n == nil or n == '' -%}manual{%- else -%}{{ n | strip }}{%- endif -%}"
      lookback: "{%- assign v = inputs.lookback -%}{%- if v == nil or v == '' -%}6 hours{%- else -%}{{ v | strip }}{%- endif -%}"

  - name: identity
    type: data.set
    with:
      title: "[SRE] AppHub → Meridium latency — {{ steps.extract.output.service }} → {{ steps.extract.output.dest }}"
      dedup_tag: "apphub-meridium-{{ steps.extract.output.service }}-{{ steps.extract.output.dest }}"
      dash_url: "{{ kibanaUrl }}/s/sre/app/dashboards#/view/sre-apphub-meridium-latency?_g=(time:(from:now-3d,to:now))"

  - name: find_open
    type: cases.findCases
    with:
      owner: observability
      status:
        - open
        - in-progress
      tags:
        - "{{ steps.identity.output.dedup_tag }}"
      category: application
      sortField: updatedAt
      sortOrder: desc
      perPage: 5

  - name: recovered_closeout
    type: if
    condition: 'event.alerts[0].kibana.alert.status : "recovered"'
    steps:
      - name: recovered_has_case
        type: if
        condition: "steps.find_open.output.total > 0"
        steps:
          - name: get_recovered_case
            type: cases.getCase
            with:
              case_id: "{{ steps.find_open.output.cases[0].id }}"
              include_comments: false
          - name: recovered_approval
            type: data.set
            with:
              approval_status: "{%- assign st = 'unknown' -%}{%- assign fields = steps.get_recovered_case.output.case.customFields -%}{%- if fields == nil -%}{%- assign fields = steps.get_recovered_case.output.customFields -%}{%- endif -%}{%- for f in fields -%}{%- if f.key == 'approval-status' -%}{%- assign st = f.value -%}{%- endif -%}{%- endfor -%}{{ st }}"
          - name: recovered_comment
            type: cases.addComment
            with:
              case_id: "{{ steps.find_open.output.cases[0].id }}"
              comment: |
                ## Recovered

                AppHub → Meridium latency / error signal recovered for
                `{{ steps.extract.output.service }}` → `{{ steps.extract.output.dest }}`.
                Approval status: `{{ steps.recovered_approval.output.approval_status }}`.
          - name: maybe_close
            type: if
            condition: 'not steps.recovered_approval.output.approval_status : "pending"'
            steps:
              - name: close_recovered
                type: cases.closeCase
                with:
                  case_id: "{{ steps.find_open.output.cases[0].id }}"

  - name: active_incident
    type: if
    condition: 'not event.alerts[0].kibana.alert.status : "recovered"'
    steps:
      - name: upsert_case
        type: if
        condition: "steps.find_open.output.total > 0"
        steps:
          - name: update_existing
            type: cases.updateCase
            on-failure:
              continue: true
            with:
              case_id: "{{ steps.find_open.output.cases[0].id }}"
              updates:
                status: in-progress
          - name: existing_id
            type: data.set
            with:
              case_id: "{{ steps.find_open.output.cases[0].id }}"
        else:
          - name: create_case
            type: cases.createCase
            with:
              title: "{{ steps.identity.output.title }}"
              description: |
                AppHub client hop to APM Classic / Meridium is slow, erroring, or timing out.

                - Caller (account-id field): `{{ steps.extract.output.service }}`
                - Destination (region + domain-name fields): `{{ steps.extract.output.dest }}`
                - Hop (node-id field): `apphub-client`

                Alert: {{ event.alerts[0].kibana.alert.reason }}

                Dashboard: {{ steps.identity.output.dash_url }}

                Workflow will add RCA and pause for HITL. Do not change routing until a human approves.
              owner: observability
              severity: medium
              category: application
              tags:
                - sre
                - apphub
                - meridium
                - latency
                - "{{ steps.identity.output.dedup_tag }}"
              customFields:
                - key: account-id
                  type: text
                  value: "{{ steps.extract.output.service }}"
                - key: region
                  type: text
                  value: "{{ steps.extract.output.dest }}"
                - key: domain-name
                  type: text
                  value: "{{ steps.extract.output.dest }}"
                - key: node-id
                  type: text
                  value: apphub-client
                - key: approval-status
                  type: text
                  value: pending
          - name: new_id
            type: data.set
            with:
              case_id: "{{ steps.create_case.output.case.id }}"

      - name: resolve_id
        type: data.set
        with:
          case_id: "{%- assign existing = steps.find_open.output.cases[0].id -%}{%- if existing and existing != '' -%}{{ existing }}{%- else -%}{{ steps.create_case.output.case.id }}{%- endif -%}"

      - name: kickoff_comment
        type: cases.addComment
        with:
          case_id: "{{ steps.resolve_id.output.case_id }}"
          comment: |
            ## Investigation started

            Workflow fired for **{{ steps.extract.output.rule_name }}**.

            - Caller: `{{ steps.extract.output.service }}`
            - Destination: `{{ steps.extract.output.dest }}`
            - Lookback: {{ steps.extract.output.lookback }}
            - Alert ID: `{{ event.alerts[0]._id }}`
            - Reason: {{ event.alerts[0].kibana.alert.reason }}

            Case: {{ kibanaUrl }}/s/sre/app/observability/cases/{{ steps.resolve_id.output.case_id }}
            Dashboard: {{ steps.identity.output.dash_url }}

      - name: evidence_dest
        type: elasticsearch.esql.query
        on-failure:
          continue: true
        with:
          format: json
          query: |
            FROM metrics-service_destination.1m.otel-default
            | WHERE @timestamp > NOW() - {{ steps.extract.output.lookback }}
            | WHERE `resource.attributes.service.name` == "{{ steps.extract.output.service }}"
            | WHERE `attributes.span.destination.service.resource` == "{{ steps.extract.output.dest }}"
            | STATS calls = SUM(`metrics.span.destination.service.response_time.count`),
                    sum_us = SUM(`metrics.span.destination.service.response_time.sum.us`),
                    fail_calls = SUM(CASE(`attributes.event.outcome` == "failure", `metrics.span.destination.service.response_time.count`, 0))
                BY `attributes.span.name`, `attributes.event.outcome`
            | EVAL avg_ms = ROUND(sum_us / calls / 1000.0, 2)
            | SORT calls DESC
            | LIMIT 20

      - name: evidence_hourly
        type: elasticsearch.esql.query
        on-failure:
          continue: true
        with:
          format: json
          query: |
            FROM metrics-service_destination.1m.otel-default
            | WHERE @timestamp > NOW() - {{ steps.extract.output.lookback }}
            | WHERE `resource.attributes.service.name` == "{{ steps.extract.output.service }}"
            | WHERE `attributes.span.destination.service.resource` == "{{ steps.extract.output.dest }}"
            | EVAL t = DATE_TRUNC(1 hour, @timestamp)
            | STATS calls = SUM(`metrics.span.destination.service.response_time.count`),
                    sum_us = SUM(`metrics.span.destination.service.response_time.sum.us`),
                    fail_calls = SUM(CASE(`attributes.event.outcome` == "failure", `metrics.span.destination.service.response_time.count`, 0))
                BY t
            | EVAL avg_ms = ROUND(sum_us / calls / 1000.0, 1),
                   fail_pct = ROUND(100.0 * fail_calls / calls, 2)
            | SORT t ASC
            | LIMIT 80

      - name: evidence_paths
        type: elasticsearch.esql.query
        on-failure:
          continue: true
        with:
          format: json
          query: |
            FROM traces-generic.otel-default
            | WHERE @timestamp > NOW() - {{ steps.extract.output.lookback }}
            | WHERE `resource.attributes.service.name` == "{{ steps.extract.output.service }}"
            | WHERE `attributes.span.destination.service.resource` == "{{ steps.extract.output.dest }}"
            | STATS spans = COUNT(*),
                    avg_ms = ROUND(AVG(`attributes.span.duration.us`) / 1000.0, 1),
                    p95_ms = ROUND(PERCENTILE(`attributes.span.duration.us`, 95) / 1000.0, 1),
                    fails = SUM(CASE(`attributes.event.outcome` == "failure", 1, 0))
                BY `attributes.http.method`, `attributes.http.target`, `attributes.http.status_code`
            | SORT p95_ms DESC
            | LIMIT 25

      - name: evidence_timeouts
        type: elasticsearch.esql.query
        on-failure:
          continue: true
        with:
          format: json
          query: |
            FROM traces-generic.otel-default
            | WHERE @timestamp > NOW() - {{ steps.extract.output.lookback }}
            | WHERE `resource.attributes.service.name` == "{{ steps.extract.output.service }}"
            | WHERE `attributes.span.destination.service.resource` == "{{ steps.extract.output.dest }}"
            | WHERE `attributes.span.duration.us` >= 30000000
            | STATS timeouts = COUNT(*),
                    p95_ms = ROUND(PERCENTILE(`attributes.span.duration.us`, 95) / 1000.0, 1),
                    max_ms = ROUND(MAX(`attributes.span.duration.us`) / 1000.0, 1)
                BY `attributes.http.method`, `attributes.http.target`, `attributes.http.status_code`
            | SORT timeouts DESC
            | LIMIT 20

      - name: classify
        type: ai.classify
        with:
          includeRationale: true
          fallbackCategory: latency.unknown
          temperature: 0
          categories:
            - name: timeout.client
              description: Many spans ≥30s or ~300s with missing HTTP status — AppHub client aborted waiting on Meridium/Classic.
            - name: meridium.slow_path
              description: Success rate is fine but a specific HTTP path has high p95 (e.g. session, queryengine, IM config).
            - name: meridium.errors
              description: Elevated 4xx/5xx or failure share on Classic/Meridium paths; latency may be secondary.
            - name: apphub.proxy
              description: Failures concentrated on AppHub template/proxy paths (e.g. app-hub-template.html 404) rather than Meridium APIs.
            - name: latency.unknown
              description: Evidence missing or signals conflict.
          instructions: |
            You are an SRE classifying AppHub → Meridium/APM Classic latency.
            Caller {{ steps.extract.output.service }} destination {{ steps.extract.output.dest }}.
            Prefer timeout.client if timeout rows are non-empty or max duration is near 300s.
            Prefer meridium.slow_path if p95 is high on API paths but fail_pct is low.
            Prefer meridium.errors if fail_pct is high or 5xx/4xx dominate.
            Prefer apphub.proxy if the slow/failing path is a hub template or proxy asset, not a Meridium API.
            Do not invent metric values.
          input: |
            RULE: {{ steps.extract.output.rule_name }}
            ALERT_REASON: {{ event.alerts[0].kibana.alert.reason }}
            SERVICE: {{ steps.extract.output.service }}
            DEST: {{ steps.extract.output.dest }}

            DEST_COLUMNS: ${{ steps.evidence_dest.output.columns | json }}
            DEST_VALUES: ${{ steps.evidence_dest.output.values | json }}

            HOURLY_COLUMNS: ${{ steps.evidence_hourly.output.columns | json }}
            HOURLY_VALUES: ${{ steps.evidence_hourly.output.values | json }}

            PATH_COLUMNS: ${{ steps.evidence_paths.output.columns | json }}
            PATH_VALUES: ${{ steps.evidence_paths.output.values | json }}

            TIMEOUT_COLUMNS: ${{ steps.evidence_timeouts.output.columns | json }}
            TIMEOUT_VALUES: ${{ steps.evidence_timeouts.output.values | json }}

      - name: map_rca
        type: data.set
        with:
          fix_id: "{%- assign c = steps.classify.output.category -%}{%- if c == 'timeout.client' or c == 'meridium.slow_path' or c == 'meridium.errors' -%}escalate_meridium_owners{%- elsif c == 'apphub.proxy' -%}investigate_apphub_proxy{%- else -%}watch_gather_more{%- endif -%}"
          severity: "{%- assign c = steps.classify.output.category -%}{%- if c == 'timeout.client' or c == 'meridium.errors' -%}high{%- elsif c == 'meridium.slow_path' -%}medium{%- else -%}low{%- endif -%}"

      - name: rca
        type: ai.prompt
        with:
          temperature: 0
          systemPrompt: |
            You are an SRE writing a case comment for AppHub → Meridium latency.
            Use only the evidence JSON and the already-chosen RCA class. Do not invent metrics.
            If a values array is empty, say the query returned no rows.
            recommended_fix_id must be exactly the provided recommended fix_id.
            Propose owner actions as text only — do not claim anything was applied.
          outputFormat:
            type: object
            properties:
              summary:
                type: string
              likely_cause:
                type: string
              latency_trend:
                type: string
              slow_paths:
                type: string
              recommended_fix_id:
                type: string
              remediation_steps:
                type: array
                items:
                  type: string
              evidence_bullets:
                type: array
                items:
                  type: string
            required:
              - summary
              - likely_cause
              - latency_trend
              - slow_paths
              - recommended_fix_id
              - remediation_steps
          prompt: |
            RCA class: {{ steps.classify.output.category }}
            recommended_fix_id: {{ steps.map_rca.output.fix_id }}
            Classifier rationale: {{ steps.classify.output.rationale }}

            DEST_VALUES: ${{ steps.evidence_dest.output.values | json }}
            HOURLY_VALUES: ${{ steps.evidence_hourly.output.values | json }}
            PATH_VALUES: ${{ steps.evidence_paths.output.values | json }}
            TIMEOUT_VALUES: ${{ steps.evidence_timeouts.output.values | json }}

      - name: set_severity
        type: cases.setSeverity
        on-failure:
          continue: true
        with:
          case_id: "{{ steps.resolve_id.output.case_id }}"
          severity: "{{ steps.map_rca.output.severity }}"

      - name: set_rca_class
        type: cases.setCustomField
        on-failure:
          continue: true
        with:
          case_id: "{{ steps.resolve_id.output.case_id }}"
          owner: observability
          field_name: rca-class
          value: "{{ steps.classify.output.category }}"

      - name: set_proposed_fix
        type: cases.setCustomField
        on-failure:
          continue: true
        with:
          case_id: "{{ steps.resolve_id.output.case_id }}"
          owner: observability
          field_name: proposed-fix
          value: "{{ steps.map_rca.output.fix_id }}"

      - name: write_rca
        type: cases.addComment
        with:
          case_id: "{{ steps.resolve_id.output.case_id }}"
          comment: |
            ## RCA

            - **Class:** `{{ steps.classify.output.category }}`
            - **Recommended fix_id:** `{{ steps.map_rca.output.fix_id }}`
            - **Severity:** {{ steps.map_rca.output.severity }}
            - **Classifier rationale:** {{ steps.classify.output.rationale }}

            **Summary:** {{ steps.rca.output.content.summary }}

            **Likely cause:** {{ steps.rca.output.content.likely_cause }}

            **Latency trend:** {{ steps.rca.output.content.latency_trend }}

            **Slow paths:** {{ steps.rca.output.content.slow_paths }}

            **Evidence:**
            {%- for b in steps.rca.output.content.evidence_bullets %}
            - {{ b }}
            {%- endfor %}

            **Proposed remediation (not applied):**
            {%- for s in steps.rca.output.content.remediation_steps %}
            - {{ s }}
            {%- endfor %}

            Approve or reject in the workflow execution HITL form. Resume only from Kibana.
            This workflow never changes routing or service config.

      - name: approve_fix
        type: waitForInput
        timeout: 24h
        on-failure:
          fallback:
            - name: hitl_timeout_note
              type: cases.addComment
              with:
                case_id: "{{ steps.resolve_id.output.case_id }}"
                comment: |
                  HITL timed out after 24h. `approval-status` remains pending. No change was applied.
        with:
          message: |
            ## Approve next step for `{{ steps.extract.output.service }}` → `{{ steps.extract.output.dest }}`?

            **RCA class:** `{{ steps.classify.output.category }}`
            **Recommended fix_id:** `{{ steps.map_rca.output.fix_id }}`
            **Severity:** {{ steps.map_rca.output.severity }}

            {{ steps.rca.output.content.summary }}

            - Likely cause: {{ steps.rca.output.content.likely_cause }}
            - Latency trend: {{ steps.rca.output.content.latency_trend }}
            - Slow paths: {{ steps.rca.output.content.slow_paths }}

            [Case]({{ kibanaUrl }}/s/sre/app/observability/cases/{{ steps.resolve_id.output.case_id }})

            Choosing **escalate_meridium_owners** records a handoff to Meridium/APM Classic;
            **investigate_apphub_proxy** records an AppHub-side proxy/template investigation.
            Both are recorded on the case only — this workflow does not mutate anything.
          schema:
            type: object
            properties:
              decision:
                type: string
                enum:
                  - escalate_meridium_owners
                  - investigate_apphub_proxy
                  - reject_false_positive
                description: HITL decision
              notes:
                type: string
                description: Optional notes for the case
            required:
              - decision

      - name: set_approval_status
        type: cases.setCustomField
        with:
          case_id: "{{ steps.resolve_id.output.case_id }}"
          owner: observability
          field_name: approval-status
          value: "{%- assign d = steps.approve_fix.output.response.decision -%}{%- if d == nil or d == '' -%}{%- assign d = steps.approve_fix.output.decision -%}{%- endif -%}{{ d }}"

      - name: after_approval
        type: cases.addComment
        with:
          case_id: "{{ steps.resolve_id.output.case_id }}"
          comment: |
            ## HITL decision

            - **Decision:** `{%- assign d = steps.approve_fix.output.response.decision -%}{%- if d == nil or d == '' -%}{%- assign d = steps.approve_fix.output.decision -%}{%- endif -%}{{ d }}`
            - **Notes:** {%- assign n = steps.approve_fix.output.response.notes -%}{%- if n == nil or n == '' -%}{%- assign n = steps.approve_fix.output.notes -%}{%- endif -%}{{ n }}
            - **Responded by:** {{ steps.approve_fix.output.respondedBy }}
            - **Recommended fix_id was:** `{{ steps.map_rca.output.fix_id }}`

            No routing or service mutation was performed by this workflow.
