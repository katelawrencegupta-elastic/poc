[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geh-synthetic"
version = "0.1.0"
description = "Synthetic CT indicator and detector LPP/honeycomb factories for GEH testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.scripts]
geh-synthetic = "geh_synthetic.cli:main"

[tool.setuptools.packages.find]
include = ["geh_synthetic*"]
