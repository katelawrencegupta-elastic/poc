version: "1"
name: CT Hybrid Search API
enabled: true
description: >
  Manual/API hybrid search over CT indicator events. Combines BM25 keyword
  search with semantic search on indicator_message_semantic using RRF.
  Run via POST /api/workflows/workflow/ct-hybrid-search-api/run so executions
  appear in the Workflows UI. (The ES Search Application path is sync-only and
  does not create workflow executions.)
triggers:
  - type: manual
    with:
      inputs:
        - name: query
          type: string
          required: true
          description: Natural language or keyword search
        - name: size
          type: number
          required: false
          default: 10
          description: Results to return
        - name: hospital
          type: string
          required: false
          default: ""
          description: Filter by hospital name
        - name: sysid
          type: string
          required: false
          default: ""
          description: Filter by system ID
        - name: severity
          type: string
          required: false
          default: ""
          description: Critical, Informational, Warning, etc.
        - name: rank_window_size
          type: number
          required: false
          default: 100
          description: RRF candidate pool size
        - name: rank_constant
          type: number
          required: false
          default: 60
          description: RRF ranking constant
steps:
  # Coerce missing/empty inputs so Search Application mustache never emits
  # invalid JSON like `"size": ,`.
  - name: normalize_inputs
    type: data.set
    with:
      query: "{%- if inputs.query and inputs.query != '' -%}{{ inputs.query | strip }}{%- else -%}detector{%- endif -%}"
      size: "{%- if inputs.size and inputs.size != '' -%}{{ inputs.size }}{%- else -%}10{%- endif -%}"
      hospital: "{%- if inputs.hospital and inputs.hospital != '' -%}{{ inputs.hospital | strip }}{%- endif -%}"
      sysid: "{%- if inputs.sysid and inputs.sysid != '' -%}{{ inputs.sysid | strip }}{%- endif -%}"
      severity: "{%- if inputs.severity and inputs.severity != '' -%}{{ inputs.severity | strip }}{%- endif -%}"
      rank_window_size: "{%- if inputs.rank_window_size and inputs.rank_window_size != '' -%}{{ inputs.rank_window_size }}{%- else -%}100{%- endif -%}"
      rank_constant: "{%- if inputs.rank_constant and inputs.rank_constant != '' -%}{{ inputs.rank_constant }}{%- else -%}60{%- endif -%}"

  - name: hybrid_search
    type: elasticsearch.request
    with:
      method: POST
      path: /_application/search_application/ct-hybrid-search-api/_search
      body:
        params:
          query: "{{ variables.query }}"
          size: "{{ variables.size }}"
          hospital: "{{ variables.hospital }}"
          sysid: "{{ variables.sysid }}"
          severity: "{{ variables.severity }}"
          rank_window_size: "{{ variables.rank_window_size }}"
          rank_constant: "{{ variables.rank_constant }}"

  - name: summarize_hits
    type: data.set
    with:
      hit_count: "{{ steps.hybrid_search.output.hits.hits | size }}"
      total: "{{ steps.hybrid_search.output.hits.total.value }}"
      results: "${{ steps.hybrid_search.output.hits.hits | map: '_source' | json }}"
